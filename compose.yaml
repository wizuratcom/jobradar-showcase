services:
  showcase:
    build: .
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - demo_data:/app/data
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  demo_data:
